title: "Ebu Bekir"
description: "Independent offensive security researcher, freelance bug hunter and blue teamer."
baseurl: ""
url: "https://acarsec.github.io"

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
  - scope:
      path: "pages"
    values:
      layout: page

plugins:
  - jekyll-feed

markdown: kramdown
highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

google_verification: "BURAYA_KOD"
bing_verification:   "BURAYA_KOD"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
